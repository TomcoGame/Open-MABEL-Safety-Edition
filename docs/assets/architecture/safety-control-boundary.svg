<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" role="img" aria-labelledby="t d"><title id="t">Safety architecture concept</title><desc id="d">Application stack is existing baseline, independent safety control is proposed and unverified</desc><rect width="1440" height="700" fill="#0b1118"/><g font-family="Arial,Helvetica,sans-serif"><text x="55" y="70" fill="#fff" font-size="37" font-weight="700">SAFETY CONTROL ARCHITECTURE</text><text x="56" y="110" fill="#9caeba" font-size="21">Logical boundary · not verified wiring · proposed elements in yellow</text><rect x="55" y="150" width="620" height="470" rx="20" fill="#14212c" stroke="#5a9fca" stroke-width="3"/><text x="88" y="205" fill="#9fd8ff" font-size="27" font-weight="700">APPLICATION / BASELINE</text><rect x="110" y="250" width="510" height="90" rx="12" fill="#223a4b" stroke="#70b1d9"/><text x="365" y="304" text-anchor="middle" fill="#fff" font-size="26">ROS 2 · Teleop · AI / Planning</text><path d="M365 340v55" stroke="#c6dce8" stroke-width="4"/><path d="m353 384 12 18 12-18" fill="none" stroke="#c6dce8" stroke-width="4"/><rect x="110" y="405" width="510" height="90" rx="12" fill="#223a4b" stroke="#70b1d9"/><text x="365" y="459" text-anchor="middle" fill="#fff" font-size="26">Motion controller / commands</text><path d="M365 495v42" stroke="#c6dce8" stroke-width="4"/><rect x="110" y="537" width="510" height="58" rx="10" fill="#223a4b" stroke="#70b1d9"/><text x="365" y="575" text-anchor="middle" fill="#fff" font-size="23">Drive / lift / arm interfaces</text><rect x="760" y="150" width="625" height="470" rx="20" fill="#1f1c11" stroke="#ffca31" stroke-width="4" stroke-dasharray="14 9"/><text x="800" y="205" fill="#ffca31" font-size="27" font-weight="700">PROPOSED SAFETY DOMAIN</text><rect x="805" y="250" width="535" height="76" rx="12" fill="#332b16" stroke="#ffca31"/><text x="1072" y="298" text-anchor="middle" fill="#fff" font-size="24">E-stop · Protective sensing · Feedback</text><path d="M1072 326v49" stroke="#ffca31" stroke-width="4" stroke-dasharray="10 7"/><rect x="805" y="375" width="535" height="90" rx="12" fill="#332b16" stroke="#ffca31" stroke-width="3"/><text x="1072" y="427" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Independent safety controller</text><path d="M1072 465v49" stroke="#ffca31" stroke-width="4" stroke-dasharray="10 7"/><rect x="805" y="514" width="535" height="81" rx="12" fill="#332b16" stroke="#ffca31"/><text x="1072" y="550" text-anchor="middle" fill="#fff" font-size="23">Stop / inhibit / brake interfaces</text><text x="1072" y="579" text-anchor="middle" fill="#ffca31" font-size="18">NOT IMPLEMENTED / VERIFIED</text><path d="M805 558H675" stroke="#ffca31" stroke-width="5" stroke-dasharray="12 8"/><path d="m687 546-17 12 17 12" stroke="#ffca31" stroke-width="4" fill="none"/><text x="718" y="535" fill="#ffca31" text-anchor="middle" font-size="17">intervention</text><text x="58" y="663" fill="#aebcc6" font-size="20">Blue = upstream application boundary</text><text x="745" y="663" fill="#ffca31" font-size="20">Dashed yellow = proposed safety interfaces</text></g></svg>