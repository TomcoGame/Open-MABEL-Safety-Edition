<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="t d"><title id="t">Open MABEL Safety Edition — Risk Assessment Concept Infographic</title><desc id="d">Engineering infographic explaining the flow from robot task and hazardous situation through risk evaluation, hierarchy of risk reduction, residual risk and evidence traceability. An illustrative lift descent example is used, without numerical risk scores or claims of implemented safety features.</desc><rect width="1600" height="960" fill="#F5F7F8"/><rect width="1600" height="13" fill="#FFCF32"/><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="13" width="1600" height="115" fill="#171D26"/><text x="42" y="60" font-size="22" font-weight="800" fill="#FFCF32">OPEN MABEL / SAFETY EDITION</text><text x="42" y="104" font-size="37" font-weight="800" fill="#fff">RISK ASSESSMENT — FROM HAZARD TO EVIDENCE</text><text x="42" y="174" font-size="20" fill="#303A43">One example: unexpected descent of a gravity-loaded lift near a person</text><text x="42" y="205" font-size="17" fill="#69717C">Purpose: understand the hazardous situation, reduce risk, then document the engineering argument.</text>
<path d="M50 250 H1550" stroke="#C6CCD1" stroke-width="2"/><text x="42" y="279" font-size="19" font-weight="800" fill="#171D26">01  DEFINE THE SCENARIO</text><rect x="42" y="302" width="1516" height="110" rx="9" fill="#fff" stroke="#C6CCD1"/><path d="M470 302 V412 M995 302 V412" stroke="#C6CCD1"/><text x="65" y="333" font-size="16" font-weight="700" fill="#69717C">ROBOT TASK / CONTEXT</text><text x="65" y="370" font-size="22" font-weight="700" fill="#171D26">Lift moving near personnel</text><text x="493" y="333" font-size="16" font-weight="700" fill="#69717C">HAZARDOUS SITUATION</text><text x="493" y="370" font-size="22" font-weight="700" fill="#171D26">Unexpected descent</text><text x="1018" y="333" font-size="16" font-weight="700" fill="#69717C">POTENTIAL HARM</text><text x="1018" y="370" font-size="22" font-weight="700" fill="#171D26">Impact / crushing</text>
<text x="42" y="461" font-size="19" font-weight="800" fill="#171D26">02  EVALUATE RISK</text><rect x="42" y="480" width="685" height="144" rx="9" fill="#171D26"/><text x="67" y="518" font-size="23" font-weight="700" fill="#FFCF32">Risk evaluation is contextual</text><text x="67" y="555" font-size="19" fill="#fff">Severity of possible harm</text><text x="67" y="583" font-size="19" fill="#fff">Exposure and ability to avoid harm</text><text x="67" y="610" font-size="15" fill="#CED4DB">Apply the selected standard-specific method; document assumptions.</text><path d="M744 548 H782" stroke="#171D26" stroke-width="5"/><path d="M772 536 l15 12 -15 12" stroke="#171D26" fill="none" stroke-width="4"/><text x="807" y="461" font-size="19" font-weight="800" fill="#171D26">03  REDUCE RISK</text><rect x="807" y="480" width="751" height="144" rx="9" fill="#fff" stroke="#C6CCD1"/><rect x="825" y="498" width="713" height="31" rx="4" fill="#FFCF32"/><text x="842" y="520" font-size="17" font-weight="800" fill="#171D26">PRIORITIZE: INHERENTLY SAFE DESIGN</text><text x="842" y="555" font-size="18" fill="#303A43">Then safeguarding and complementary protective measures</text><text x="842" y="582" font-size="18" fill="#303A43">Then information for use / residual-risk communication</text><text x="842" y="609" font-size="15" fill="#69717C">Example options: load retention, braking, access restriction</text>
<path d="M800 642 V673" stroke="#171D26" stroke-width="4"/><path d="M790 663 l10 14 10 -14" fill="none" stroke="#171D26" stroke-width="4"/><text x="42" y="704" font-size="19" font-weight="800" fill="#171D26">04  REVIEW RESIDUAL RISK AND TRACE THE OUTCOME</text><rect x="42" y="725" width="1516" height="132" rx="9" fill="#fff" stroke="#C6CCD1"/><rect x="63" y="744" width="316" height="88" rx="7" fill="#FFF4C2"/><text x="80" y="776" font-size="19" font-weight="800" fill="#171D26">REASSESS</text><text x="80" y="804" font-size="16" fill="#303A43">Acceptable? Or iterate controls.</text><path d="M387 788 H425" stroke="#171D26" stroke-width="4"/><path d="M417 778 l12 10 -12 10" fill="none" stroke="#171D26" stroke-width="3"/><rect x="434" y="744" width="335" height="88" rx="7" fill="#E9EDF0"/><text x="450" y="776" font-size="19" font-weight="800" fill="#171D26">SPECIFY REQUIREMENTS</text><text x="450" y="804" font-size="16" fill="#303A43">Trigger, safe state, acceptance.</text><path d="M778 788 H816" stroke="#171D26" stroke-width="4"/><path d="M808 778 l12 10 -12 10" fill="none" stroke="#171D26" stroke-width="3"/><rect x="826" y="744" width="328" height="88" rx="7" fill="#E9EDF0"/><text x="842" y="776" font-size="19" font-weight="800" fill="#171D26">DESIGN &amp; VERIFY</text><text x="842" y="804" font-size="16" fill="#303A43">Implement, test, record results.</text><path d="M1163 788 H1201" stroke="#171D26" stroke-width="4"/><path d="M1193 778 l12 10 -12 10" fill="none" stroke="#171D26" stroke-width="3"/><rect x="1211" y="744" width="326" height="88" rx="7" fill="#171D26"/><text x="1227" y="776" font-size="19" font-weight="800" fill="#FFCF32">REVIEW EVIDENCE</text><text x="1227" y="804" font-size="16" fill="#fff">Trace and approve records.</text>
<text x="42" y="909" font-size="19" font-weight="700" fill="#171D26">KEY PRINCIPLE: Risk assessment is iterative. A safeguard is not evidence of effectiveness until verified.</text><text x="42" y="938" font-size="15" fill="#69717C">Illustrative engineering lesson only — no assigned risk score, PL/SIL target or implementation claim.</text></g></svg>