<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title description"><title id="title">Open MABEL Safety Edition: guided risk assessment lesson</title><desc id="description">Six illustrated stages explain risk assessment through an example of unexpected lift descent near a person: define context, identify hazard, estimate risk, reduce risk, review residual risk, and trace verification. Illustrative only.</desc><rect width="1440" height="900" fill="#F5F7F8"/><rect width="1440" height="12" fill="#FFCF32"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="64" font-size="34" font-weight="800" fill="#171D26">HOW RISK ASSESSMENT WORKS</text><text x="42" y="101" font-size="19" fill="#4E5863">Follow a MABEL lift example from hazardous situation to documented risk reduction.</text><g transform="translate(42,145)"><rect width="432" height="242" rx="16" fill="#FFFFFF" stroke="#CFD4D9" stroke-width="2"/><rect width="432" height="12" rx="6" fill="#FFCF32"/><text x="22" y="51" font-size="18" font-weight="800" fill="#171D26">01  DEFINE THE CONTEXT</text><text x="22" y="91" font-size="20" font-weight="700" fill="#171D26">What is the robot doing?</text><text x="22" y="130" font-size="17" fill="#39434D">Example: MABEL lift moves while a person</text><text x="22" y="158" font-size="17" fill="#39434D">may enter the reachable workspace.</text><rect x="16" y="186" width="400" height="38" rx="8" fill="#F4F6F8"/><text x="25" y="211" font-size="15" font-weight="600" fill="#4E5863">Record: configuration, mode, task, exposure.</text></g><g transform="translate(502,145)"><rect width="432" height="242" rx="16" fill="#FFFFFF" stroke="#CFD4D9" stroke-width="2"/><rect width="432" height="12" rx="6" fill="#FFCF32"/><text x="22" y="51" font-size="18" font-weight="800" fill="#171D26">02  IDENTIFY THE HAZARD</text><text x="22" y="91" font-size="20" font-weight="700" fill="#171D26">What could cause harm?</text><text x="22" y="130" font-size="17" fill="#39434D">Gravity-loaded lift could descend unexpectedly.</text><text x="22" y="158" font-size="17" fill="#39434D">Person nearby may be struck or crushed.</text><rect x="16" y="186" width="400" height="38" rx="8" fill="#F4F6F8"/><text x="25" y="211" font-size="15" font-weight="600" fill="#4E5863">Record: event, cause, harm, exposed person.</text></g><g transform="translate(962,145)"><rect width="432" height="242" rx="16" fill="#FFFFFF" stroke="#CFD4D9" stroke-width="2"/><rect width="432" height="12" rx="6" fill="#FFCF32"/><text x="22" y="51" font-size="18" font-weight="800" fill="#171D26">03  ESTIMATE AND EVALUATE RISK</text><text x="22" y="91" font-size="20" font-weight="700" fill="#171D26">How serious and likely is the harm?</text><text x="22" y="130" font-size="17" fill="#39434D">Consider severity, exposure and possibility</text><text x="22" y="158" font-size="17" fill="#39434D">of avoidance using the selected method.</text><rect x="16" y="186" width="400" height="38" rx="8" fill="#F4F6F8"/><text x="25" y="211" font-size="15" font-weight="600" fill="#4E5863">Record: assumptions and risk decision.</text></g><g transform="translate(42,415)"><rect width="432" height="242" rx="16" fill="#FFFFFF" stroke="#CFD4D9" stroke-width="2"/><rect width="432" height="12" rx="6" fill="#FFCF32"/><text x="22" y="51" font-size="18" font-weight="800" fill="#171D26">04  REDUCE THE RISK</text><text x="22" y="91" font-size="20" font-weight="700" fill="#171D26">What safeguards change the scenario?</text><text x="22" y="130" font-size="17" fill="#39434D">Consider load retention, monitored braking,</text><text x="22" y="158" font-size="17" fill="#39434D">access control and safe response to faults.</text><rect x="16" y="186" width="400" height="38" rx="8" fill="#F4F6F8"/><text x="25" y="211" font-size="15" font-weight="600" fill="#4E5863">Record: options and allocated controls.</text></g><g transform="translate(502,415)"><rect width="432" height="242" rx="16" fill="#FFFFFF" stroke="#CFD4D9" stroke-width="2"/><rect width="432" height="12" rx="6" fill="#FFCF32"/><text x="22" y="51" font-size="18" font-weight="800" fill="#171D26">05  CHECK RESIDUAL RISK</text><text x="22" y="91" font-size="20" font-weight="700" fill="#171D26">Is the remaining risk acceptable?</text><text x="22" y="130" font-size="17" fill="#39434D">Re-evaluate the scenario with selected controls.</text><text x="22" y="158" font-size="17" fill="#39434D">If unacceptable, improve controls and repeat.</text><rect x="16" y="186" width="400" height="38" rx="8" fill="#F4F6F8"/><text x="25" y="211" font-size="15" font-weight="600" fill="#4E5863">Record: residual risk and open actions.</text></g><g transform="translate(962,415)"><rect width="432" height="242" rx="16" fill="#FFFFFF" stroke="#CFD4D9" stroke-width="2"/><rect width="432" height="12" rx="6" fill="#FFCF32"/><text x="22" y="51" font-size="18" font-weight="800" fill="#171D26">06  TRACE AND VERIFY</text><text x="22" y="91" font-size="20" font-weight="700" fill="#171D26">How do we demonstrate the outcome?</text><text x="22" y="130" font-size="17" fill="#39434D">Link hazard to safety requirement, design,</text><text x="22" y="158" font-size="17" fill="#39434D">test criteria, results and reviewed evidence.</text><rect x="16" y="186" width="400" height="38" rx="8" fill="#F4F6F8"/><text x="25" y="211" font-size="15" font-weight="600" fill="#4E5863">Record: IDs, owners, approvals and revisions.</text></g><rect x="42" y="145" width="432" height="242" rx="16" fill="none" stroke="#E1A400" stroke-width="7" pointer-events="none"><animate attributeName="x" values="42;502;962;42;502;962;42" keyTimes="0;.1667;.3333;.5;.6667;.8333;1" dur="36s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="y" values="145;145;145;415;415;415;145" keyTimes="0;.1667;.3333;.5;.6667;.8333;1" dur="36s" calcMode="discrete" repeatCount="indefinite"/></rect><text x="42" y="765" font-size="17" fill="#69717C">Animated focus advances every 6 seconds; all steps remain readable if animation is disabled.</text><path d="M1140 801 H1280" stroke="#E1A400" stroke-width="4"/><path d="M1270 790 l14 11 -14 11" stroke="#E1A400" fill="none" stroke-width="4"/><text x="42" y="827" font-size="19" font-weight="700" fill="#171D26">KEY IDEA: Risk assessment is iterative, not a one-time checklist.</text><text x="42" y="859" font-size="16" fill="#69717C">Illustrative teaching scenario only. Actual risk ratings, safety measures and acceptance require configuration-specific analysis.</text></g></svg>