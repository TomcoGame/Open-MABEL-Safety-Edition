17C">Risk criteria</text><text x="125" y="107" font-size="12" text-anchor="middle" fill="#69717C">03</text></g><g transform="translate(870,104)"><rect width="250" height="124" rx="12" fill="#FFFFFF" stroke="#171D26" stroke-width="2"/><rect width="250" height="11" rx="6" fill="#FFCF32"/><text x="125" y="48" font-size="17" font-weight="700" text-anchor="middle" fill="#171D26">Select controls</text><text x="125" y="79" font-size="14" text-anchor="middle" fill="#69717C">Risk reduction</text><text x="125" y="107" font-size="12" text-anchor="middle" fill="#69717C">04</text></g><g transform="translate(1150,104)"><rect width="250" height="124" rx="12" fill="#FFFFFF" stroke="#171D26" stroke-width="2"/><rect width="250" height="11" rx="6" fill="#FFCF32"/><text x="125" y="48" font-size="17" font-weight="700" text-anchor="middle" fill="#171D26">Review residual risk</text><text x="125" y="79" font-size="14" text-anchor="middle" fill="#69717C">Record assumptions</text><text x="125" y="107" font-size="12" text-anchor="middle" fill="#69717C">05</text></g><path d="M283 166 h19 l-7 -7 m7 7 l-7 7" fill="none" stroke="#171D26" stroke-width="2.5"/><path d="M563 166 h19 l-7 -7 m7 7 l-7 7" fill="none" stroke="#171D26" stroke-width="2.5"/><path d="M843 166 h19 l-7 -7 m7 7 l-7 7" fill="none" stroke="#171D26" stroke-width="2.5"/><path d="M1123 166 h19 l-7 -7 m7 7 l-7 7" fill="none" stroke="#171D26" stroke-width="2.5"/></g><rect x="30" y="104" width="250" height="124" rx="12" fill="none" stroke="#E7A900" stroke-width="5" opacity=".95"><animate attributeName="x" values="30;310;590;870;1150;30" keyTimes="0;.2;.4;.6;.8;1" dur="12s" repeatCount="indefinite"/></rect><text x="30" y="282" font-family="Arial,sans-serif" font-size="13" fill="#69717C">Process illustration · Refer to linked engineering artifacts for actual project status and approvals</text></svg>