<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 730" role="img" aria-labelledby="title description"><title id="title">Open MABEL risk assessment spreadsheet walkthrough</title><desc id="description">An engineering spreadsheet with columns for subsystem, operating context, hazardous situation, risk evaluation, risk reduction, residual risk, and requirements evidence. The animation highlights successive columns and explains a hypothetical MABEL lift hazard.</desc><rect width="1640" height="730" fill="#F5F7F8"/><rect width="1640" height="10" fill="#FFCF32"/><g font-family="Arial,Helvetica,sans-serif"><rect x="30" y="22" width="1580" height="59" rx="10" fill="#171D26"/><text x="48" y="60" font-size="24" font-weight="800" fill="#FFCF32">OPEN MABEL</text><text x="235" y="60" font-size="23" font-weight="700" fill="#fff">SAFETY EDITION / RISK ASSESSMENT WORKSHEET</text><text x="1365" y="58" font-size="15" fill="#E9EDF0">ILLUSTRATIVE EXAMPLE</text><text x="45" y="124" font-size="24" font-weight="800" fill="#171D26">READ ACROSS ROW 01 — LIFT EXAMPLE</text><text x="45" y="158" font-size="19" fill="#303A43">Follow the hazardous situation from operating context through controls and evidence.</text><text x="45" y="188" font-size="16" fill="#69717C">The highlighted column starts the worksheet; all seven columns are visible for review.</text><rect x="45" y="215" width="1550" height="282" fill="#fff" stroke="#BFC6CC" stroke-width="2"/><rect x="45" y="215" width="125" height="38" fill="#E9EDF0" stroke="#C6CCD1"/><text x="57" y="240" font-size="17" font-weight="700" fill="#171D26">A</text><rect x="45" y="253" width="125" height="68" fill="#F4F6F8" stroke="#C6CCD1"/><text x="55" y="293" font-size="15" font-weight="700" fill="#171D26">Subsystem</text><rect x="45" y="321" width="125" height="88" fill="#FFFDF2" stroke="#D1D7DC"/><text x="55" y="358" font-size="14" fill="#303A43">Lift</text><rect x="45" y="409" width="125" height="88" fill="#fff" stroke="#D1D7DC"/><text x="55" y="446" font-size="14" fill="#303A43">Mobile base</text><rect x="45" y="497" width="125" height="88" fill="#fff" stroke="#D1D7DC"/><text x="55" y="534" font-size="14" fill="#303A43">Manipulator</text><rect x="170" y="215" width="220" height="38" fill="#E9EDF0" stroke="#C6CCD1"/><text x="182" y="240" font-size="17" font-weight="700" fill="#171D26">B</text><rect x="170" y="253" width="220" height="68" fill="#F4F6F8" stroke="#C6CCD1"/><text x="180" y="293" font-size="15" font-weight="700" fill="#171D26">Operating context</text><rect x="170" y="321" width="220" height="88" fill="#FFFDF2" stroke="#D1D7DC"/><text x="180" y="358" font-size="14" fill="#303A43">Lift moves near a person</text><rect x="170" y="409" width="220" height="88" fill="#fff" stroke="#D1D7DC"/><text x="180" y="446" font-size="14" fill="#303A43">Travel near personnel</text><rect x="170" y="497" width="220" height="88" fill="#fff" stroke="#D1D7DC"/><text x="180" y="534" font-size="14" fill="#303A43">Arm reaches shared space</text><rect x="390" y="215" width="255" height="38" fill="#E9EDF0" stroke="#C6CCD1"/><text x="402" y="240" font-size="17" font-weight="700" fill="#171D26">C</text><rect x="390" y="253" width="255" height="68" fill="#F4F6F8" stroke="#C6CCD1"/><text x="400" y="293" font-size="15" font-weight="700" fill="#171D26">Hazardous situation</text><rect x="390" y="321" width="255" height="88" fill="#FFFDF2" stroke="#D1D7DC"/><text x="400" y="358" font-size="14" fill="#303A43">Unexpected descent; crushing</text><rect x="390" y="409" width="255" height="88" fill="#fff" stroke="#D1D7DC"/><text x="400" y="446" font-size="14" fill="#303A43">Unintended travel; impact</text><rect x="390" y="497" width="255" height="88" fill="#fff" stroke="#D1D7DC"/><text x="400" y="534" font-size="14" fill="#303A43">Unexpected contact</text><rect x="645" y="215" width="230" height="38" fill="#E9EDF0" stroke="#C6CCD1"/><text x="657" y="240" font-size="17" font-weight="700" fill="#171D26">D</text><rect x="645" y="253" width="230" height="68" fill="#F4F6F8" stroke="#C6CCD1"/><text x="655" y="293" font-size="15" font-weight="700" fill="#171D26">Risk evaluation</text><rect x="645" y="321" width="230" height="88" fill="#FFFDF2" stroke="#D1D7DC"/><text x="655" y="358" font-size="14" fill="#303A43">Assess severity, exposure, avo</text><text x="655" y="377" font-size="14" fill="#303A43">idance</text><rect x="645" y="409" width="230" height="88" fill="#fff" stroke="#D1D7DC"/><text x="655" y="446" font-size="14" fill="#303A43">Assessment pending</text><rect x="645" y="497" width="230" height="88" fill="#fff" stroke="#D1D7DC"/><text x="655" y="534" font-size="14" fill="#303A43">Assessment pending</text><rect x="875" y="215" width="260" height="38" fill="#E9EDF0" stroke="#C6CCD1"/><text x="887" y="240" font-size="17" font-weight="700" fill="#171D26">E</text><rect x="875" y="253" width="260" height="68" fill="#F4F6F8" stroke="#C6CCD1"/><text x="885" y="293" font-size="15" font-weight="700" fill="#171D26">Risk reduction</text><rect x="875" y="321" width="260" height="88" fill="#FFFDF2" stroke="#D1D7DC"/><text x="885" y="358" font-size="14" fill="#303A43">Consider load retention and br</text><text x="885" y="377" font-size="14" fill="#303A43">aking</text><rect x="875" y="409" width="260" height="88" fill="#fff" stroke="#D1D7DC"/><text x="885" y="446" font-size="14" fill="#303A43">Protective stop concept</text><rect x="875" y="497" width="260" height="88" fill="#fff" stroke="#D1D7DC"/><text x="885" y="534" font-size="14" fill="#303A43">Motion limiting concept</text><rect x="1135" y="215" width="205" height="38" fill="#E9EDF0" stroke="#C6CCD1"/><text x="1147" y="240" font-size="17" font-weight="700" fill="#171D26">F</text><rect x="1135" y="253" width="205" height="68" fill="#F4F6F8" stroke="#C6CCD1"/><text x="1145" y="293" font-size="15" font-weight="700" fill="#171D26">Residual risk</text><rect x="1135" y="321" width="205" height="88" fill="#FFFDF2" stroke="#D1D7DC"/><text x="1145" y="358" font-size="14" fill="#303A43">Reassess after controls</text><rect x="1135" y="409" width="205" height="88" fill="#fff" stroke="#D1D7DC"/><text x="1145" y="446" font-size="14" fill="#303A43">Pending</text><rect x="1135" y="497" width="205" height="88" fill="#fff" stroke="#D1D7DC"/><text x="1145" y="534" font-size="14" fill="#303A43">Pending</text><rect x="1340" y="215" width="255" height="38" fill="#E9EDF0" stroke="#C6CCD1"/><text x="1352" y="240" font-size="17" font-weight="700" fill="#171D26">G</text><rect x="1340" y="253" width="255" height="68" fill="#F4F6F8" stroke="#C6CCD1"/><text x="1350" y="293" font-size="15" font-weight="700" fill="#171D26">Requirements / evidence</text><rect x="1340" y="321" width="255" height="88" fill="#FFFDF2" stroke="#D1D7DC"/><text x="1350" y="358" font-size="14" fill="#303A43">Link requirement and test</text><rect x="1340" y="409" width="255" height="88" fill="#fff" stroke="#D1D7DC"/><text x="1350" y="446" font-size="14" fill="#303A43">Pending</text><rect x="1340" y="497" width="255" height="88" fill="#fff" stroke="#D1D7DC"/><text x="1350" y="534" font-size="14" fill="#303A43">Pending</text><rect x="170" y="253" width="220" height="332" fill="none" stroke="#E3A900" stroke-width="5"/><text x="45" y="635" font-size="20" font-weight="700" fill="#171D26">PROCESS: Context → Hazard → Evaluate → Reduce → Reassess → Trace and verify</text><text x="45" y="670" font-size="16" fill="#69717C">Use configuration-specific risk criteria. Candidate safeguards and requirements are examples, not installed or verified features.</text><text x="45" y="700" font-size="15" fill="#69717C">Static fallback: read across the first row, then repeat the method for each additional hazard.</text></g></svg>