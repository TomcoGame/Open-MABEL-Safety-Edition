<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 312" role="img" aria-labelledby="title desc"><title id="title">SAFETY REQUIREMENTS process</title><desc id="desc">Link hazard then Define behavior then Allocate function then Set acceptance then Baseline & trace. A conceptual process flow for Open MABEL Safety Edition.</desc><rect width="1440" height="312" fill="#F5F7F8"/><rect width="1440" height="9" fill="#FFCF32"/><text x="30" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171D26">SAFETY REQUIREMENTS</text><text x="31" y="85" font-family="Arial,sans-serif" font-size="14" fill="#69717C">OPEN MABEL · SAFETY EDITION · PROCESS GUIDE</text><g font-family="Arial,sans-serif"><g transform="translate(30,104)"><rect width="250" height="124" rx="12" fill="#FFFFFF" stroke="#171D26" stroke-width="2"/><rect width="250" height="11" rx="6" fill="#FFCF32"/><text x="125" y="48" font-size="17" font-weight="700" text-anchor="middle" fill="#171D26">Link hazard</text><text x="125" y="79" font-size="14" text-anchor="middle" fill="#69717C">Hazard ID</text><text x="125" y="107" font-size="12" text-anchor="middle" fill="#69717C">01</text></g><g transform="translate(310,104)"><rect width="250" height="124" rx="12" fill="#FFFFFF" stroke="#171D26" stroke-width="2"/><rect width="250" height="11" rx="6" fill="#FFCF32"/><text x="125" y="48" font-size="17" font-weight="700" text-anchor="middle" fill="#171D26">Define behavior</text><text x="125" y="79" font-size="14" text-anchor="middle" fill="#69717C">Trigger + safe state</text><text x="125" y="107" font-size="12" text-anchor="middle" fill="#69717C">02</text></g><g transform="translate(590,104)"><rect width="250" height="124" rx="12" fill="#FFFFFF" stroke="#171D26" stroke-width="2"/><rect width="250" height="11" rx="6" fill="#FFCF32"/><text x="125" y="48" font-size="17" font-weight="700" text-anchor="middle" fill="#171D26">Allocate function</text><text x="125" y="79" font-size="14" text-anchor="middle" fill=